plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

// One shared source tree, one JAR per Minecraft line. Version-specific classes live only in
// versions/<target>/{main,client}/{java,resources}; a class must never exist in both places.
def target = project.findProperty('mc_target') ?: '26.3'
def targetProps = new Properties()
file("versions/${target}.properties").withInputStream { targetProps.load(it) }
targetProps.each { k, v -> project.ext.set(k, v) }

version = "${project.mod_version}+${target}"
group = project.maven_group
base {
	archivesName = project.archives_base_name
}

sourceSets {
	main {
		java.srcDir "versions/${target}/main/java"
		resources.srcDir "versions/${target}/main/resources"
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"oborokage" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

sourceSets {
	client {
		java.srcDir "versions/${target}/client/java"
		resources.srcDir "versions/${target}/client/resources"
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	def expansion = [
		"version": project.version,
		"mc_dependency": project.mc_dependency,
		"api_dependency": project.api_dependency,
		"loader_dependency": project.loader_dependency
	]
	inputs.properties expansion
	filesMatching("fabric.mod.json") {
		expand expansion
	}
}

tasks.withType(JavaCompile).configureEach {
	options.release = 25
	options.encoding = 'UTF-8'
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

tasks.named('jar') {
    from('LICENSE')
}

// Pinned formatter, kept outside the release JAR. Java 25 is the supported toolchain.
['formatJava', 'formatJavaCheck'].each { taskName ->
    tasks.register(taskName, JavaExec) {
        javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }
        classpath = files('tools/google-java-format-1.29.0-all-deps.jar')
        mainClass = 'com.google.googlejavaformat.java.Main'
        jvmArgs = ['api','file','parser','tree','util','code'].collect { '--add-exports=jdk.compiler/com.sun.tools.javac.' + it + '=ALL-UNNAMED' }
        args = (taskName == 'formatJava' ? ['--replace'] : ['--dry-run', '--set-exit-if-changed']) +
               fileTree('src') { include '**/*.java' }.files.collect { it.path } +
               fileTree('versions') { include '**/*.java' }.files.collect { it.path } +
               fileTree('verification/src') { include '**/*.java' }.files.collect { it.path }
    }
}
